name: Build & Publish Docker Image

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    name: Build & push to ghcr.io
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU (for multi-platform builds)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (OCI labels & tags)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/omnibioai/omnibioai-launcher
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
            type=raw,value=${{ github.sha }}
          labels: |
            org.opencontainers.image.title=OmniBioAI Launcher
            org.opencontainers.image.description=React-based launcher UI for the OmniBioAI platform
            org.opencontainers.image.source=https://github.com/OmniBioAI/omnibioai-launcher
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.licenses=MIT

      - name: Assert full OCI revision
        env:
          FULL_SHA: ${{ github.sha }}
        run: |
          set -eu
          test "${#FULL_SHA}" -eq 40
          test "$FULL_SHA" = "$(git rev-parse HEAD)"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
          cache-from: type=registry,ref=ghcr.io/omnibioai/omnibioai-launcher:buildcache
          cache-to: type=registry,ref=ghcr.io/omnibioai/omnibioai-launcher:buildcache,mode=max

      - name: Verify published manifest
        env:
          FULL_SHA: ${{ github.sha }}
        run: |
          set -eu
          manifest=$(docker buildx imagetools inspect "ghcr.io/omnibioai/omnibioai-launcher:$FULL_SHA")
          echo "$manifest"
          echo "$manifest" | grep -q 'Platform:    linux/amd64'
          echo "$manifest" | grep -q 'Platform:    linux/arm64'
