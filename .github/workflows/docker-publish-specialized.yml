name: Build Specialized Runtime Images

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version tag to publish (without a leading v)
        required: true
        default: 1.0.1

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: vscode
            file: docker/vscode/Dockerfile
            image: ghcr.io/omnibioai/omnibioai-vscode
          - name: rstudio
            file: docker/rstudio/Dockerfile
            image: ghcr.io/omnibioai/omnibioai-rstudio

    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract OCI metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=raw,value=${{ inputs.version }}
          labels: |
            org.opencontainers.image.title=OmniBioAI ${{ matrix.name }} runtime
            org.opencontainers.image.version=${{ inputs.version }}
            org.opencontainers.image.source=https://github.com/OmniBioAI/omnibioai-launcher
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Build and publish multiarch image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ matrix.image }}:${{ inputs.version }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
      - name: Verify published manifest
        env:
          IMAGE: ${{ matrix.image }}:${{ inputs.version }}
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "$IMAGE" \
            --format '{{range .Manifest.Manifests}}{{if eq .Platform.OS "linux"}}{{if or (eq .Platform.Architecture "amd64") (eq .Platform.Architecture "arm64")}}{{.Platform.Architecture}}{{"\n"}}{{end}}{{end}}{{end}}' \
            | sort -u | diff -u <(printf '%s\n' amd64 arm64) -
